name: CI

# A pull request runs every job once; a push runs them only on main, where the merge result is
# checked again.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov=configurable_redlock --cov-report=json
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: coverage.json
        # The incremental coverage check reads one coverage report, so only one matrix leg uploads it.
        if: matrix.python-version == '3.14'

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      # eslint, markdownlint and tsc, report only.
      - run: npm run lint

  coverage:
    name: Incremental coverage check
    runs-on: ubuntu-latest
    needs: [python]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: python-coverage
      - uses: velis74/incremental-coverage-check@v3
        with:
          coverage-files: coverage.json
          extra-ignore-patterns: |
            scripts/**
            eslint.config.js
          base-ref: ${{ github.base_ref }}
          head-ref: HEAD
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}

  # The single required status check: it fails when any job above failed or was cancelled.
  all-green:
    runs-on: ubuntu-latest
    needs: [python, node, coverage]
    permissions: {}
    if: always()
    steps:
      - run: exit 1
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
